[colors]
; ── Colors set by theme-switch.sh from the active rofi theme ──
background = #303446
background-alt = #292c3c
foreground = #c6d0f5
foreground-alt = #b5bfe2
primary = #ca9ee6
secondary = #8caaee
alert = #e78284
disabled = #b5bfe2
accent = #ca9ee6
transparent = #00000000

[bar/main]
width = 100%
height = 28pt
radius = 0
; ── DPI ──────────────────────────────────────────────────────
dpi-x = 96
dpi-y = 96
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1
separator = |
separator-foreground = ${colors.disabled}

; ── Fonts ────────────────────────────────────────────────────
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "Noto Sans:size=10;2"
font-2 = "Font Awesome 7 Free:style=Solid:size=10;2"

; ── Modules Left ─────────────────────────────────────────────
modules-left = rofi-launcher i3 updates playerctl

; ── Modules Center ───────────────────────────────────────────
modules-center = date

; ── Modules Right ────────────────────────────────────────────
modules-right = volume backlight memory cpu temperature network bluetooth monitor powermenu

; ── Cursor ──────────────────────────────────────────────────
cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/rofi-launcher]
type = custom/text
format = <label>
label = " "
label-foreground = ${colors.accent}
click-left = ~/.config/i3/scripts/rofi-mode.sh drun -show-icons
click-right = ~/.config/i3/scripts/rofi-mode.sh run

[module/i3]
type = custom/script
exec = ~/.config/polybar/scripts/workspaces.sh
tail = true

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 1800
click-left = kitty --hold -e bash -c 'paru; setsid -f ~/.config/polybar/launch.sh >/dev/null 2>&1'
click-right = kitty --hold -e bash -c 'flatpak update; setsid -f ~/.config/polybar/launch.sh >/dev/null 2>&1'

[module/date]
type = internal/date
interval = 1
date = " %d/%m/%Y"
time = " %H:%M:%S"
date-alt = " %A, %d %B %Y"
time-alt = " %H:%M:%S"
label = %date% %time%
label-foreground = ${colors.accent}

[module/playerctl]
type = custom/script
exec = ~/.config/polybar/scripts/playerctl.sh
interval = 1

[module/volume]
type = custom/script
exec = ~/.config/polybar/scripts/volume.sh
interval = 2
scroll-up = ~/.config/polybar/scripts/volume.sh up
scroll-down = ~/.config/polybar/scripts/volume.sh down
click-left = ~/.config/polybar/scripts/volume.sh mute
click-right = pavucontrol

[module/backlight]
type = custom/script
exec = ~/.config/polybar/scripts/backlight.sh
interval = 2
scroll-up = ~/.config/polybar/scripts/backlight.sh up
scroll-down = ~/.config/polybar/scripts/backlight.sh down

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %percentage_used%%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %percentage%%
label-foreground = ${colors.foreground}

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 75
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}
label-foreground = ${colors.foreground}

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
click-left = ~/.config/rofi/scripts/NetManagerDM.sh --config ~/.config/rofi/themes/NetManagerDM.ini
click-right = nm-connection-editor

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 2
click-left = ~/.config/rofi/scripts/rofi-bluetooth.sh
format-prefix = " "
format-prefix-foreground = ${colors.accent}

[module/monitor]
type = custom/text
format = <label>
label = 
label-foreground = ${colors.accent}
click-left = ~/.config/rofi/scripts/rofi-monitor.sh

[module/powermenu]
type = custom/text
format = <label>
label = ""
label-foreground = ${colors.alert}
click-left = ~/.config/rofi/scripts/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = false
