# ── Picom Compositor Configuration ────────────────────────────

# ── Backend ────────────────────────────────────────────────────
backend = "glx";
vsync = true;
use-damage = true;

# ── Shadows ────────────────────────────────────────────────────
shadow = true;
shadow-radius = 12;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.5;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Dunst'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'pavucontrol'",
    "class_g = 'firefox'"
];

# ── Fading ────────────────────────────────────────────────────
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;
fade-exclude = [];
no-fading-openclose = false;

# ── Transparency / Opacity ────────────────────────────────────
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;
opacity-rule = [
    "0:_NET_WM_STATE *= '_NET_WM_STATE_HIDDEN'",
    "90:class_g = 'kitty'",
    "90:class_g = 'Alacritty'",
    "90:class_g = 'Thunar'",
    "100:class_g = 'firefox'",
    "100:class_g = 'mpv'",
    "100:class_g = 'Rofi'",
    "100:class_g = 'Polybar'",
    "0:_NET_WM_STATE *= '_NET_WM_STATE_BELOW'"
];

# ── Blur ──────────────────────────────────────────────────────
blur: {
    method = "dual_kawase";
    strength = 7;
    background = false;
    background-frame = false;
    background-frame-exclude = [];
}

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS",
    "class_g = 'firefox'",
    "class_g = 'pavucontrol'"
];

# ── Corners ────────────────────────────────────────────────────
# GTK/Firefox popup windows are plain rectangular X11 windows; their
# rounded look depends on picom clipping the window shape here, so
# they stay IN the rounding (excluding them exposes real square/black
# corners). The seam/blur artifact on pavucontrol & firefox popups
# came from shadow + blur-background, not from the rounding itself --
# those two are excluded per-app below instead.
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'mpv'"
];

# ── Other ──────────────────────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# ── Wintypes ──────────────────────────────────────────────────
wintypes: {
    tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.9; };
    dropdown_menu = { opacity = 0.9; };
    notification = { fade = true; shadow = true; };
    utility = { opacity = 1; };
    normal = { fade = true; shadow = true; };
    dialog = { fade = true; shadow = true; };
};
