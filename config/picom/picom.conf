# ── Picom Compositor Configuration ────────────────────────────

# ── Backend ────────────────────────────────────────────────────
# xrender was tried here to cut RAM: glx loads a GL/EGL userspace stack
# into picom's own process, measured at ~153MB RSS / ~94MB PSS on this
# machine's NVIDIA proprietary driver vs xrender's ~8MB / ~2.7MB. glx is
# kept anyway by explicit choice. The RAM difference is an NVIDIA-blob
# property, not something glx costs everywhere -- Mesa's open-source
# drivers (Intel/AMD) don't carry anywhere near that much fixed
# overhead, so this tradeoff mostly doesn't apply on those.
backend = "glx";
vsync = true;
use-damage = true;

# ── Shadows ────────────────────────────────────────────────────
# Off by explicit choice. shadow-radius/offset/opacity/exclude below are
# left in place, unused while shadow is false, so re-enabling is a
# one-line change instead of having to re-derive the shadow-exclude list
# (the firefox/pavucontrol/zoom/Flatseal entries were each found by
# hitting a real rendering bug -- see the comments below).
shadow = false;
shadow-radius = 12;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.5;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Dunst'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'pavucontrol'",
    "class_g = 'firefox'",
    # Zoom (flatpak) tags its main window with the KDE-only
    # _KDE_NET_WM_WINDOW_TYPE_OVERRIDE hint alongside NORMAL, and its
    # SSO webview host ships no _NET_WM_WINDOW_TYPE at all -- same
    # class of mismatch that caused the firefox/pavucontrol overlap,
    # so it gets the same shadow-exclude treatment.
    "class_g = 'zoom'",
    "class_g = 'ZoomWebviewHost.real'",
    # Flatseal's hamburger menu is _NET_WM_WINDOW_TYPE_MENU with no
    # _GTK_FRAME_EXTENTS either -- the general _GTK_FRAME_EXTENTS rule
    # above only catches popups that set that property, so this one
    # needs the same explicit class_g exclude as the others.
    "class_g = 'com.github.tchx84.Flatseal'"
];

# ── Fading ────────────────────────────────────────────────────
# fade-in/out-step is the opacity change applied every fade-delta ms --
# 0.05 needed 20 steps to fade fully in/out, which at this TV's 60Hz
# (one step per rendered frame under normal damage-driven redraws) came
# out to a sluggish ~330ms. 0.11 needs only ~9, roughly 150ms: still a
# visible fade, not an instant cut.
fading = true;
fade-in-step = 0.11;
fade-out-step = 0.11;
fade-delta = 4;
fade-exclude = [];
no-fading-openclose = false;

# ── Transparency / Opacity ────────────────────────────────────
# Fully opaque -- no decorative transparency anywhere. The two rules
# below are functional, not decorative: they keep hidden/always-below
# windows from flashing content while off-screen.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
    "0:_NET_WM_STATE *= '_NET_WM_STATE_HIDDEN'",
    "0:_NET_WM_STATE *= '_NET_WM_STATE_BELOW'"
];

# ── Corners ────────────────────────────────────────────────────
# GTK/Firefox popup windows are plain rectangular X11 windows; their
# rounded look depends on picom clipping the window shape here, so
# they stay IN the rounding (excluding them exposes real square/black
# corners). The seam artifact on pavucontrol & firefox popups came
# from shadow, not from the rounding itself -- those two are excluded
# from shadow instead (see shadow-exclude above).
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'mpv'"
];

# ── Other ──────────────────────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# ── Wintypes ──────────────────────────────────────────────────
# Per-type "shadow" here overrides the global `shadow = false` above for
# that type (that's how picom applies wintypes) -- explicitly false on
# every entry that used to opt into a shadow, so turning shadows off
# above actually turns them off everywhere, not just on the types that
# had no override.
wintypes: {
    tooltip = { fade = true; shadow = false; opacity = 1; focus = true; full-shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 1; };
    dropdown_menu = { opacity = 1; };
    notification = { fade = false; shadow = false; };
    utility = { opacity = 1; };
    normal = { fade = true; shadow = false; };
    dialog = { fade = true; shadow = false; };
};
