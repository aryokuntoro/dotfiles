# ── Picom Compositor Configuration ────────────────────────────

# ── Backend ────────────────────────────────────────────────────
backend = "glx";
vsync = true;
use-damage = true;

# ── Shadows ────────────────────────────────────────────────────
shadow = true;
shadow-radius = 12;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.5;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Dunst'",
    "class_g = 'Polybar'",
    "class_g = 'Rofi'",
    "class_g = 'i3-frame'",
    "_GTK_FRAME_EXTENTS",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'pavucontrol'",
    "class_g = 'firefox'",
    # Zoom (flatpak) tags its main window with the KDE-only
    # _KDE_NET_WM_WINDOW_TYPE_OVERRIDE hint alongside NORMAL, and its
    # SSO webview host ships no _NET_WM_WINDOW_TYPE at all -- same
    # class of mismatch that caused the firefox/pavucontrol overlap,
    # so it gets the same shadow-exclude treatment.
    "class_g = 'zoom'",
    "class_g = 'ZoomWebviewHost.real'",
    # Flatseal's hamburger menu is _NET_WM_WINDOW_TYPE_MENU with no
    # _GTK_FRAME_EXTENTS either -- the general _GTK_FRAME_EXTENTS rule
    # above only catches popups that set that property, so this one
    # needs the same explicit class_g exclude as the others.
    "class_g = 'com.github.tchx84.Flatseal'"
];

# ── Fading ────────────────────────────────────────────────────
# fade-in/out-step is the opacity change applied every fade-delta ms --
# 0.05 needed 20 steps to fade fully in/out, which at this TV's 60Hz
# (one step per rendered frame under normal damage-driven redraws) came
# out to a sluggish ~330ms. 0.11 needs only ~9, roughly 150ms: still a
# visible fade, not an instant cut.
fading = true;
fade-in-step = 0.11;
fade-out-step = 0.11;
fade-delta = 4;
fade-exclude = [];
no-fading-openclose = false;

# ── Transparency / Opacity ────────────────────────────────────
# Fully opaque -- no decorative transparency anywhere. The two rules
# below are functional, not decorative: they keep hidden/always-below
# windows from flashing content while off-screen.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
    "0:_NET_WM_STATE *= '_NET_WM_STATE_HIDDEN'",
    "0:_NET_WM_STATE *= '_NET_WM_STATE_BELOW'"
];

# ── Corners ────────────────────────────────────────────────────
# GTK/Firefox popup windows are plain rectangular X11 windows; their
# rounded look depends on picom clipping the window shape here, so
# they stay IN the rounding (excluding them exposes real square/black
# corners). The seam artifact on pavucontrol & firefox popups came
# from shadow, not from the rounding itself -- those two are excluded
# from shadow instead (see shadow-exclude above).
corner-radius = 12;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'mpv'"
];

# ── Other ──────────────────────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# ── Wintypes ──────────────────────────────────────────────────
wintypes: {
    tooltip = { fade = true; shadow = true; opacity = 1; focus = true; full-shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 1; };
    dropdown_menu = { opacity = 1; };
    notification = { fade = false; shadow = true; };
    utility = { opacity = 1; };
    normal = { fade = true; shadow = true; };
    dialog = { fade = true; shadow = true; };
};
