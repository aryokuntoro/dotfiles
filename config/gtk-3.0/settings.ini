[Settings]
gtk-xft-dpi=147456
gtk-theme-name=Everforest-Teal-Dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=JetBrainsMono Nerd Font 10
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-toolbar-style=GTK_TOOLBAR_BOTH
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=1
gtk-menu-images=1
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=1
gtk-xft-antialias=1
gtk-xft-hinting=1
# Kept identical to the Xft.* block in ~/.Xresources on purpose: rgba
# has to be none rather than rgb because HDMI-0 here is a TV whose
# subpixel layout and internal scaling don't match the RGB-stripe
# assumption, which showed as color fringing on small text, and
# hintslight goes with it. With rgb/hintfull left here, GTK apps were
# the only ones still rendering text the way the rest of the desktop
# was explicitly configured not to.
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
gtk-application-prefer-dark-theme=1
