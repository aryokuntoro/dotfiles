# ── Font ──────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# ── Cursor ────────────────────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0.5

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines 10000

# ── Window ────────────────────────────────────────────────────
window_padding_width 8
confirm_os_window_close 0
enabled_layouts tall,fat,grid,splits,stack

# ── Tab bar ───────────────────────────────────────────────────
tab_bar_edge top
tab_bar_style powerline

# ── Remote control ────────────────────────────────────────────
# Lets apply-theme-colors.sh hot-reload colors in running kitty
# windows without a restart (kitty @ --to unix:@mykitty set-colors).
allow_remote_control yes
listen_on unix:@mykitty

# ── Theme ─────────────────────────────────────────────────────
# Regenerated by ~/.config/i3/scripts/apply-theme-colors.sh from the
# active rofi .rasi theme -- do not edit this include's target by hand.
include current-theme.conf
