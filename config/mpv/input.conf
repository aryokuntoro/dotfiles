# ── MPV Keybindings ───────────────────────────────────────────

# Playback
SPACE    cycle pause
RIGHT    seek  5
LEFT     seek -5
UP       seek  60
DOWN     seek -60
Shift+RIGHT seek  1 exact
Shift+LEFT  seek -1 exact
l cycle loop
L        ab-loop

# Volume
WHEEL_UP    add volume 5
WHEEL_DOWN  add volume -5
m cycle mute

# Subtitles
v          cycle sub
V          cycle sub-visibility
b          cycle sub-down
n          cycle sub-up
x          add sub-delay -0.1
z          add sub-delay +0.1
r          add sub-scale -0.05
R          add sub-scale +0.05

# Audio
a          cycle audio
q          quit
Q          quit-watch-later

# Screenshot
S          screenshot
Alt+s      screenshot video

# Playlist
>          playlist-next
<          playlist-prev

# Aspect ratio
A          cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no"

# Deinterlace
d          cycle deinterlace

# Fullscreen
f          cycle fullscreen

# OSD
o          show-progress
