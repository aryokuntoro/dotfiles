# ── MPV Keybindings ───────────────────────────────────────────

# Playback
SPACE    cycle pause
RIGHT    seek  5
LEFT     seek -5
UP       seek  60
DOWN     seek -60
Shift+RIGHT seek  1 exact
Shift+LEFT  seek -1 exact
l cycle loop
L        ab-loop

# Volume
WHEEL_UP    add volume 5
WHEEL_DOWN  add volume -5
m cycle mute

# Subtitles
v          cycle sub
V          cycle sub-visibility
b          cycle sub-down
n          cycle sub-up
x          add sub-delay -0.1
z          add sub-delay +0.1
r          add sub-scale -0.05
R          add sub-scale +0.05

# Audio
a          cycle audio
q          quit
Q          quit-watch-later

# Screenshot
S          screenshot
Alt+s      screenshot video

# Playlist
>          playlist-next
<          playlist-prev

# Aspect ratio
A          cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no"

# Deinterlace
d          cycle deinterlace

# Fullscreen
f          cycle fullscreen

# OSD
o          show-progress

# Stream quality (mpv-quality-menu) -- F/Alt+f, not f/alt+f: mpv's
# input.conf is case-sensitive, so these sit alongside the existing
# plain `f` (fullscreen) without touching it. Checked against every
# binding above before adding.
F          script-binding quality_menu/video_formats_toggle
Alt+f      script-binding quality_menu/audio_formats_toggle
Ctrl+r     script-binding quality_menu/reload

# Anime4K GLSL shaders -- Ctrl+1..6 select a mode, Ctrl+0 clears.
# Low-end/"Fast" variants throughout: this machine's GTX 1650 is a
# mid-range card, and the shaders stack on top of vo=gpu's normal
# rendering regardless of hwdec (hwdec=no above only affects decoding,
# not this). Off by default for every video -- these are keybinds, not
# an mpv.conf glsl-shaders= default, so a screen recording or anything
# non-anime opened in mpv is never paying this cost unless asked to.
Ctrl+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode A (Fast)"
Ctrl+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode B (Fast)"
Ctrl+3 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode C (Fast)"
Ctrl+4 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_Restore_CNN_S.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode A+A (Fast)"
Ctrl+5 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_S.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode B+B (Fast)"
Ctrl+6 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Restore_CNN_S.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Mode C+A (Fast)"
Ctrl+0 no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"
