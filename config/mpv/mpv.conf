# ── MPV Configuration ──────────────────────────────────────────

# ── Video ──────────────────────────────────────────────────────
vo=gpu
gpu-api=auto
# auto-safe already probes per-codec whether hw decode actually works
# on whatever GPU is present and falls back to software on its own --
# no hwdec-codecs whitelist here, since which codecs a GPU can decode
# in hardware varies by vendor and generation (this machine's GTX 1650
# has no AV1 hw decoder, an Intel iGPU from Tiger Lake on does, an AMD
# card's support varies by generation again) and a list tuned for one
# GPU is exactly wrong on another.
hwdec=auto-safe
gpu-context=auto
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
interpolation=yes
video-sync=display-resample
tscale=oversample
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=5
dither-depth=auto
temporal-dither=yes
temporal-dither-period=1

# ── Audio ──────────────────────────────────────────────────────
ao=pulse,alsa
audio-channels=auto
audio-normalize-downmix=yes
replaygain=track
replaygain-preamp=0
replaygain-clip=no
replaygain-fallback=0
volume=100
volume-max=200

# ── Subtitles ──────────────────────────────────────────────────
sub-auto=fuzzy
sub-font="JetBrainsMono Nerd Font"
sub-font-size=14
sub-color="#ebdbb2"
sub-border-color="#282828"
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color="#000000"
sub-bold=yes
sub-ass-override=force
sub-ass-style-overrides="FontName=JetBrainsMono Nerd Font,FontSize=14,PrimaryColour=&H00ebdbb2,OutlineColour=&H00282828,BorderStyle=1,Outline=2,Shadow=1"

# ── Screenshots ────────────────────────────────────────────────
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=6
screenshot-directory=~/Pictures/Screenshots/mpv
screenshot-template="%F-%P-%n"

# ── OSD ────────────────────────────────────────────────────────
osd-font="JetBrainsMono Nerd Font"
osd-font-size=14
osd-color="#ebdbb2"
osd-border-color="#282828"
osd-border-size=2
osd-bar-align-y=0.95
osd-bar-w=80
osd-bar-h=2
osd-duration=2000

# ── Cache ──────────────────────────────────────────────────────
cache=yes
demuxer-max-bytes=500M
demuxer-max-back-bytes=100M

# ── yt-dlp ────────────────────────────────────────────────────
script-opts=ytdl_hook-ytdl_path=yt-dlp
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
ytdl-raw-options=ignore-config=yes,format-sort=ext

# ── Misc ───────────────────────────────────────────────────────
keep-open=yes
force-window=immediate
cursor-autohide=500
autofit=70%x70%
geometry=50%+0+0
border=no
title="${media-title}"
