# ── MPV Configuration ──────────────────────────────────────────

# ── Video ──────────────────────────────────────────────────────
vo=gpu
gpu-api=auto
# Off, not auto-safe. Reproduced directly: opening the same NVENC-
# encoded recording in 2-3 concurrent mpv windows (recordrofi.sh's
# "Select Area + Webcam" testing habit, or just checking a few clips
# back to back) left one of them unresponsive to its own close button --
# `i3-msg [id=...] kill` (a real WM_DELETE_WINDOW close request)
# reported success while the process kept running, and even a plain
# SIGTERM sometimes needed a follow-up SIGKILL. Software decode has no
# such contention: the same repro (3 concurrent windows, same file,
# closed the same way) closed every one of them cleanly with --hwdec=no
# and hung with hwdec=auto-safe, back to back, on this exact machine.
# Consumer NVIDIA GPUs (this one's a GTX 1650) are the usual suspect --
# they cap concurrent NVDEC sessions at the driver level, and a decode
# stuck waiting on a session slot that never frees blocks mpv's main
# thread along with it, not just the video. Software decode costs more
# CPU; for reviewing a screen recording (rarely more than 1080p) that's
# a trade worth making over a player that can silently stop responding
# to its own window manager.
hwdec=no
gpu-context=auto
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
interpolation=yes
video-sync=display-resample
tscale=oversample
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=5
dither-depth=auto
temporal-dither=yes
temporal-dither-period=1

# ── Audio ──────────────────────────────────────────────────────
ao=pulse,alsa
audio-channels=auto
audio-normalize-downmix=yes
replaygain=track
replaygain-preamp=0
replaygain-clip=no
replaygain-fallback=0
volume=100
volume-max=200

# ── Subtitles ──────────────────────────────────────────────────
sub-auto=fuzzy
sub-font="JetBrainsMono Nerd Font"
sub-font-size=14
sub-color="#ebdbb2"
sub-border-color="#282828"
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color="#000000"
sub-bold=yes
sub-ass-override=force
sub-ass-style-overrides="FontName=JetBrainsMono Nerd Font,FontSize=14,PrimaryColour=&H00ebdbb2,OutlineColour=&H00282828,BorderStyle=1,Outline=2,Shadow=1"

# ── Screenshots ────────────────────────────────────────────────
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=6
screenshot-directory=~/Pictures/Screenshots/mpv
screenshot-template="%F-%P-%n"

# ── OSD ────────────────────────────────────────────────────────
osd-font="JetBrainsMono Nerd Font"
osd-font-size=14
osd-color="#ebdbb2"
osd-border-color="#282828"
osd-border-size=2
osd-bar-align-y=0.95
osd-bar-w=80
osd-bar-h=2
osd-duration=2000

# ── Cache ──────────────────────────────────────────────────────
cache=yes
demuxer-max-bytes=500M
demuxer-max-back-bytes=100M

# ── yt-dlp ────────────────────────────────────────────────────
script-opts=ytdl_hook-ytdl_path=yt-dlp
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
# ignore-config= (empty value), not =yes: --ignore-config is a boolean
# flag in yt-dlp that takes no argument. mpv's own docs for
# ytdl-raw-options say a valueless option "must include =" with nothing
# after it -- writing =yes instead makes mpv hand yt-dlp the literal
# string "yes" as a second, separate argv token, which yt-dlp then reads
# as an extra URL to download. Reproduced directly: `yt-dlp --ignore-config
# yes --simulate <url>` throws the exact "[generic] 'yes' is not a valid
# URL" error mpv was logging on every single YouTube video, confirming
# this was breaking playback outright, not just the youtube-upnext script.
ytdl-raw-options=ignore-config=,format-sort=ext

# ── OSC (ModernZ) ──────────────────────────────────────────────
# ModernZ (scripts/modernz.lua) replaces the stock on-screen controller
# -- required by ModernZ's own install instructions: leaving the stock
# osc on draws both at once. title-bar=no is ModernZ's suggested
# pairing for a clean look; harmless either way since i3 draws mpv's
# actual window border/titlebar itself; this is just mpv's own
# internal one on top of the video, which ModernZ already replaces.
osc=no
title-bar=no
# ModernZ's own startup warning: without this, its sub-position margin
# adjustment (making room for the OSC bar) gets saved into watch-later
# state, then reapplied redundantly on resume, until subtitles drift
# progressively further up the screen across sessions. Confirmed this
# was actually firing (saw the warning in mpv's own log), not a
# preemptive guess.
watch-later-options-remove=sub-pos

# ── Misc ───────────────────────────────────────────────────────
keep-open=yes
force-window=immediate
cursor-autohide=500
autofit=70%x70%
geometry=50%+0+0
border=no
title="${media-title}"
