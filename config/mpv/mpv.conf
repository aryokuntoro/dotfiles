# ── MPV Configuration ──────────────────────────────────────────

# ── Video ──────────────────────────────────────────────────────
vo=gpu
gpu-api=auto
hwdec=auto-safe
# This machine's GPU (GTX 1650, Turing/NVDEC gen 4) has no AV1 hw
# decoder -- AV1 support only arrived with Ampere's NVDEC gen 5. Skip
# straight to software decode for it instead of cycling through
# Vulkan/CUDA/VAAPI first.
hwdec-codecs=h264,vc1,hevc,vp8,vp9
gpu-context=auto
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
interpolation=yes
video-sync=display-resample
tscale=oversample
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=5
dither-depth=auto
temporal-dither=yes
temporal-dither-period=1

# ── Audio ──────────────────────────────────────────────────────
ao=pulse,alsa
audio-channels=auto
audio-normalize-downmix=yes
replaygain=track
replaygain-preamp=0
replaygain-clip=no
replaygain-fallback=0
volume=100
volume-max=200

# ── Subtitles ──────────────────────────────────────────────────
sub-auto=fuzzy
sub-font="JetBrainsMono Nerd Font"
sub-font-size=14
sub-color="#ebdbb2"
sub-border-color="#282828"
sub-border-size=2
sub-shadow-offset=1
sub-shadow-color="#000000"
sub-bold=yes
sub-ass-override=force
sub-ass-style-overrides="FontName=JetBrainsMono Nerd Font,FontSize=14,PrimaryColour=&H00ebdbb2,OutlineColour=&H00282828,BorderStyle=1,Outline=2,Shadow=1"

# ── Screenshots ────────────────────────────────────────────────
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-png-compression=6
screenshot-directory=~/Pictures/Screenshots/mpv
screenshot-template="%F-%P-%n"

# ── OSD ────────────────────────────────────────────────────────
osd-font="JetBrainsMono Nerd Font"
osd-font-size=14
osd-color="#ebdbb2"
osd-border-color="#282828"
osd-border-size=2
osd-bar-align-y=0.95
osd-bar-w=80
osd-bar-h=2
osd-duration=2000

# ── Cache ──────────────────────────────────────────────────────
cache=yes
demuxer-max-bytes=500M
demuxer-max-back-bytes=100M

# ── yt-dlp ────────────────────────────────────────────────────
script-opts=ytdl_hook-ytdl_path=yt-dlp
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
ytdl-raw-options=ignore-config=yes,format-sort=ext

# ── Misc ───────────────────────────────────────────────────────
keep-open=yes
force-window=immediate
cursor-autohide=500
autofit=70%x70%
geometry=50%+0+0
border=no
title="${media-title}"
